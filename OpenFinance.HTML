<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Cofre | Controle financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','system-ui','sans-serif']},colors:{bg:'#0f172a',card:'#1e293b',line:'#334155',em:'#10b981',ind:'#6366f1',ros:'#f43f5e'}}}}</script>
<style type="text/tailwindcss">
:root{color-scheme:dark}
body{@apply bg-bg text-slate-200 font-sans antialiased}
.card{@apply bg-card/70 border border-line/70 rounded-2xl p-4}
.inp{@apply w-full bg-bg border border-line rounded-xl px-3 py-2.5 text-sm outline-none focus:border-ind}
.btn{@apply rounded-xl px-4 py-2.5 text-sm font-semibold bg-ind text-white hover:opacity-90 transition}
.lbl{@apply block text-xs text-slate-400 mb-1}
.nav{@apply flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-400 hover:text-white}
.nav.on{@apply bg-ind/15 text-white}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script>
const $=s=>document.querySelector(s),J=JSON,L=localStorage;
const get=(k,d)=>{try{return J.parse(L.getItem(k))??d}catch{return d}},set=(k,v)=>L.setItem(k,J.stringify(v));
const R=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},ym=d=>d.slice(0,7);
const CATS={d:['Alimentação','Moradia','Transporte','Lazer','Saúde','Educação','Contas','Outros'],r:['Salário','Freela','Renda Extra','Outros']};
const AV=['🦊','🐼','🦁','🐙','🦄','🐯'],PAL=['#6366f1','#10b981','#f43f5e','#f59e0b','#06b6d4','#a855f7','#84cc16','#94a3b8'];
const TABS=[['dash','layout-dashboard','Início'],['tx','arrow-left-right','Lançamentos'],['inv','piggy-bank','Investir'],['ia','sparkles','Assistente']];
let users=get('fin_users',[]),U=null,D=null,charts={},S={tab:'dash',month:ym(today()),t:'d',auth:'login',email:'',chat:[],sim:{ini:1000,pm:300,pct:110,name:''}};
Chart.defaults.color='#94a3b8';Chart.defaults.font.family='"Plus Jakarta Sans",sans-serif';
Chart.defaults.plugins.tooltip.callbacks.label=c=>` ${c.dataset.label||c.label}: ${R(c.parsed.y??c.parsed)}`;

/* ---------- sessão e dados (isolados por usuário) ---------- */
const save=()=>set('fin_data_'+U.id,D);
function start(u){U=u;set('fin_session',u.id);D={tx:[],inv:[],cdi:10.5,key:'',model:'gemini-1.5-flash',...get('fin_data_'+u.id,{})};S.tab='dash';S.chat=[];render()}
const logout=()=>{L.removeItem('fin_session');U=D=null;S.auth='login';S.email='';render()};
const go=t=>{S.tab=t;render();scrollTo(0,0)};
const sw=k=>{S.email=$('[name=e]').value;S.auth=k;render()};
const pick=id=>{S.email=users.find(u=>u.id==id).email;S.auth='login';render();$('[name=p]').focus()};
function auth(e){const f=e.target,em=f.e.value.trim().toLowerCase(),err=m=>$('#err').textContent=m;
 if(S.auth=='reg'){
  if(users.some(u=>u.email==em))return err('Este e-mail já tem conta. Use a aba Entrar.');
  const u={id:'u'+Date.now().toString(36),name:f.n.value.trim(),email:em,ph:hash(f.p.value),av:f.a.value};
  users.push(u);set('fin_users',users);start(u)
 }else{const u=users.find(u=>u.email==em&&u.ph==hash(f.p.value));if(!u)return err('E-mail ou senha incorretos.');start(u)}}

/* ---------- cálculos ---------- */
const inM=m=>D.tx.filter(x=>ym(x.date)==m),sum=(a,t)=>a.filter(x=>x.type==t).reduce((s,x)=>s+x.v,0);
function stats(){const mt=inM(S.month),r=sum(mt,'r'),d=sum(mt,'d'),cats={};
 mt.filter(x=>x.type=='d').forEach(x=>cats[x.cat]=(cats[x.cat]||0)+x.v);
 return{r,d,cats,bal:sum(D.tx,'r')-sum(D.tx,'d'),sav:r?Math.round((r-d)/r*100):0,inv:D.inv.reduce((s,i)=>s+i.ini,0),fix:mt.filter(x=>x.type=='d'&&x.kind=='f').reduce((s,x)=>s+x.v,0)}}
const proj=(a,p,pct,n,cdi)=>{const i=(1+cdi*pct/1e4)**(1/12)-1;let v=a;return[a,...Array.from({length:n},()=>v=v*(1+i)+p)]};
const mname=()=>new Date(S.month+'-15').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});

/* ---------- telas ---------- */
function authView(){const reg=S.auth=='reg';
return `<div class="min-h-screen grid place-items-center p-4"><div class="w-full max-w-md">
<div class="text-center mb-6"><span class="inline-grid place-items-center w-14 h-14 rounded-2xl bg-gradient-to-br from-ind to-em mb-3"><i data-lucide="wallet" class="w-7 h-7 text-white"></i></span><h1 class="text-2xl font-extrabold">Cofre</h1><p class="text-sm text-slate-400">Receitas, gastos e investimentos no mesmo lugar.</p></div>
${users.length?`<p class="lbl">Perfis neste aparelho</p><div class="flex gap-2 overflow-x-auto pb-3">${users.map(u=>`<button onclick="pick('${u.id}')" class="card !p-3 w-24 shrink-0 text-center hover:border-ind"><div class="text-2xl">${u.av}</div><div class="text-xs mt-1 truncate">${esc(u.name)}</div></button>`).join('')}</div>`:''}
<form onsubmit="auth(event);return false" class="card space-y-3">
<div class="flex bg-bg rounded-xl p-1 text-sm font-semibold">${[['login','Entrar'],['reg','Criar conta']].map(([k,l])=>`<button type="button" onclick="sw('${k}')" class="flex-1 py-2 rounded-lg ${S.auth==k?'bg-card text-white':'text-slate-400'}">${l}</button>`).join('')}</div>
${reg?`<div><label class="lbl">Nome</label><input name="n" required class="inp"></div><div><label class="lbl">Avatar</label><div class="flex gap-2">${AV.map((a,i)=>`<label class="cursor-pointer"><input type="radio" name="a" value="${a}" class="peer hidden" ${i?'':'checked'}><span class="w-10 h-10 grid place-items-center rounded-xl bg-bg text-xl peer-checked:bg-ind/30 peer-checked:ring-2 peer-checked:ring-ind">${a}</span></label>`).join('')}</div></div>`:''}
<div><label class="lbl">E-mail</label><input name="e" type="email" required class="inp" value="${esc(S.email)}"></div>
<div><label class="lbl">Senha</label><input name="p" type="password" required minlength="4" class="inp"></div>
<button class="btn w-full">${reg?'Criar conta':'Entrar'}</button><p id="err" class="text-xs text-ros min-h-4"></p></form>
<p class="text-xs text-slate-500 text-center mt-4">Os dados ficam só neste navegador, separados por perfil.</p></div></div>`}

function shell(body){const nm=['dash','tx'].includes(S.tab);
return `<aside class="hidden md:flex fixed inset-y-0 left-0 w-60 flex-col border-r border-line/70 p-4 bg-bg">
<div class="flex items-center gap-2 font-extrabold text-lg mb-6 px-2"><span class="grid place-items-center w-9 h-9 rounded-xl bg-gradient-to-br from-ind to-em"><i data-lucide="wallet" class="w-5 h-5 text-white"></i></span>Cofre</div>
<nav class="space-y-1 flex-1">${TABS.map(([k,i,l])=>`<button onclick="go('${k}')" class="nav w-full ${S.tab==k?'on':''}"><i data-lucide="${i}" class="w-5 h-5"></i>${l}</button>`).join('')}</nav>
<div class="card !p-3 flex items-center gap-3"><span class="text-2xl">${U.av}</span><div class="min-w-0 flex-1"><div class="text-sm font-semibold truncate">${esc(U.name)}</div><div class="text-xs text-slate-400 truncate">${esc(U.email)}</div></div><button onclick="logout()" title="Sair" class="text-slate-400 hover:text-ros"><i data-lucide="log-out" class="w-4 h-4"></i></button></div></aside>
<main class="md:ml-60 p-4 md:p-8 pb-28 md:pb-8 max-w-6xl">
<header class="flex items-center justify-between mb-5 gap-3"><div class="md:hidden flex items-center gap-2"><span class="text-2xl">${U.av}</span><b>${esc(U.name.split(' ')[0])}</b></div><h1 class="hidden md:block text-2xl font-extrabold">${TABS.find(t=>t[0]==S.tab)[2]}</h1>
<div class="flex items-center gap-2">${nm?`<input type="month" value="${S.month}" onchange="S.month=this.value||S.month;render()" class="inp !w-auto">`:''}<button onclick="logout()" title="Sair" class="md:hidden text-slate-400 p-2"><i data-lucide="log-out" class="w-5 h-5"></i></button></div></header>
${body}</main>
${nm&&S.tab!='tx'?`<button onclick="go('tx')" title="Novo lançamento" class="md:hidden fixed right-4 bottom-20 w-14 h-14 rounded-full bg-em text-white shadow-lg shadow-em/30 grid place-items-center"><i data-lucide="plus" class="w-6 h-6"></i></button>`:''}
<nav class="md:hidden fixed bottom-0 inset-x-0 bg-bg/95 backdrop-blur border-t border-line/70 grid grid-cols-4 pb-[env(safe-area-inset-bottom)]">${TABS.map(([k,i,l])=>`<button onclick="go('${k}')" class="py-3 flex flex-col items-center gap-1 text-[11px] ${S.tab==k?'text-ind':'text-slate-400'}"><i data-lucide="${i}" class="w-5 h-5"></i>${l}</button>`).join('')}</nav>`}

function list(a,del){return a.length?`<ul class="divide-y divide-line/60">${a.map(x=>`<li class="flex items-center gap-3 py-2.5"><span class="w-9 h-9 shrink-0 rounded-xl grid place-items-center ${x.type=='r'?'bg-em/15 text-em':'bg-ros/15 text-ros'}"><i data-lucide="${x.type=='r'?'arrow-down-left':'arrow-up-right'}" class="w-4 h-4"></i></span><div class="min-w-0 flex-1"><div class="text-sm font-semibold truncate">${esc(x.desc)}</div><div class="text-xs text-slate-400">${esc(x.cat)}, ${x.kind=='f'?'fixo':'variável'}, ${x.date.split('-').reverse().join('/')}</div></div><b class="text-sm ${x.type=='r'?'text-em':'text-ros'}">${x.type=='r'?'+':'-'}${R(x.v)}</b>${del?`<button onclick="delTx('${x.id}')" title="Excluir" class="text-slate-500 hover:text-ros"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}</li>`).join('')}</ul>`:'<p class="text-sm text-slate-400 py-6 text-center">Nenhum lançamento neste mês.</p>'}
const byDate=a=>a.slice().sort((x,y)=>y.date.localeCompare(x.date));

function dash(){const s=stats(),c=(l,v,k,i)=>`<div class="card"><div class="flex items-center justify-between text-xs text-slate-400 mb-2">${l}<i data-lucide="${i}" class="w-4 h-4 ${k}"></i></div><div class="text-xl md:text-2xl font-extrabold ${k}">${v}</div></div>`;
return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${c('Saldo total',R(s.bal),'text-white','wallet')}${c('Receitas do mês',R(s.r),'text-em','trending-up')}${c('Despesas do mês',R(s.d),'text-ros','trending-down')}${c('Taxa de poupança',s.sav+'%',s.sav>=0?'text-ind':'text-ros','percent')}</div>
${D.tx.length?'':`<div class="card mb-4 text-center"><p class="mb-3 text-slate-300">Você ainda não tem lançamentos. Adicione o primeiro ou explore com dados de exemplo.</p><button class="btn" onclick="demo()">Carregar dados de exemplo</button></div>`}
<div class="grid lg:grid-cols-5 gap-4"><div class="card lg:col-span-2"><h3 class="font-bold mb-3">Despesas por categoria</h3><div class="h-64"><canvas id="c1"></canvas></div></div><div class="card lg:col-span-3"><h3 class="font-bold mb-3">Receitas e despesas, últimos 6 meses</h3><div class="h-64"><canvas id="c2"></canvas></div></div></div>
<div class="card mt-4"><h3 class="font-bold mb-2">Últimos lançamentos</h3>${list(byDate(D.tx).slice(0,5))}</div>`}

function tx(){const r=S.t=='r';
return `<div class="grid lg:grid-cols-3 gap-4"><form onsubmit="addTx(event);return false" class="card space-y-3 h-fit">
<div class="flex bg-bg rounded-xl p-1 text-sm font-semibold">${[['d','Despesa','bg-ros'],['r','Receita','bg-em']].map(([k,l,c])=>`<button type="button" onclick="S.t='${k}';render()" class="flex-1 py-2 rounded-lg ${S.t==k?c+' text-white':'text-slate-400'}">${l}</button>`).join('')}</div>
<div><label class="lbl">Descrição</label><input name="d" required class="inp" placeholder="${r?'Ex.: Salário de outubro':'Ex.: Aluguel'}"></div>
<div class="grid grid-cols-2 gap-3"><div><label class="lbl">Valor (R$)</label><input name="v" type="number" step="0.01" min="0.01" required class="inp"></div><div><label class="lbl">${r?'Data de recebimento':'Vencimento'}</label><input name="t" type="date" value="${today()}" required class="inp"></div></div>
<div class="grid grid-cols-2 gap-3"><div><label class="lbl">${r?'Fonte':'Categoria'}</label><select name="c" class="inp">${CATS[S.t].map(c=>`<option>${c}</option>`).join('')}</select></div><div><label class="lbl">Tipo</label><select name="k" class="inp"><option value="f">Fixo</option><option value="v">Variável</option></select></div></div>
<button class="btn w-full ${r?'!bg-em':'!bg-ros'}">Adicionar ${r?'receita':'despesa'}</button></form>
<div class="card lg:col-span-2"><h3 class="font-bold mb-2">Lançamentos de ${mname()}</h3>${list(byDate(inM(S.month)),1)}</div></div>`}
function addTx(e){const f=e.target;D.tx.push({id:'t'+Date.now(),type:S.t,desc:f.d.value.trim(),v:+f.v.value,date:f.t.value,cat:f.c.value,kind:f.k.value});save();S.month=ym(f.t.value);render()}
const delTx=id=>{D.tx=D.tx.filter(x=>x.id!=id);save();render()};
function demo(){const n=new Date();
 for(let i=5;i>=0;i--){const p=new Date(n.getFullYear(),n.getMonth()-i,5).toISOString().slice(0,8),a=(type,desc,v,cat,kind,dd)=>D.tx.push({id:'t'+Math.random().toString(36).slice(2),type,desc,v,cat,kind,date:p+dd});
  a('r','Salário',5200,'Salário','f','05');a('r','Projeto freela',300+i*120,'Freela','v','18');a('d','Aluguel',1500,'Moradia','f','10');a('d','Mercado',650+i*30,'Alimentação','v','12');a('d','Transporte',280,'Transporte','v','15');a('d','Streaming e saídas',200+i*25,'Lazer','v','20');a('d','Plano de saúde',320,'Saúde','f','08')}
 if(!D.inv.length)D.inv.push({id:'i1',name:'Reserva de emergência',ini:4000,pm:400,pct:110},{id:'i2',name:'Caixinha das férias',ini:800,pm:150,pct:100});
 save();render()}

function inv(){const s=S.sim;
return `<div class="grid lg:grid-cols-3 gap-4"><div class="card space-y-3 h-fit"><h3 class="font-bold">Simulador de cofrinho</h3>
<div><label class="lbl">Nome do cofrinho</label><input id="s_n" class="inp" placeholder="Ex.: Caixinha das férias" value="${esc(s.name)}"></div>
${[['s_i','Valor inicial (R$)',s.ini],['s_p','Aporte mensal (R$)',s.pm],['s_c','Rendimento (% do CDI)',s.pct],['s_b','CDI base (% ao ano)',D.cdi]].map(([id,l,v])=>`<div><label class="lbl">${l}</label><input id="${id}" type="number" step="0.01" min="0" value="${v}" oninput="simUp()" class="inp"></div>`).join('')}
<button class="btn w-full" onclick="saveInv()">Salvar cofrinho</button><p class="text-xs text-slate-500">Projeção bruta (antes de IR), com juros compostos e aporte no fim de cada mês.</p></div>
<div class="lg:col-span-2 space-y-4"><div id="res" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div><div class="card"><h3 class="font-bold mb-3">Patrimônio e total aportado em 5 anos</h3><div class="h-72"><canvas id="c3"></canvas></div></div></div></div>
<h3 class="font-bold mt-6 mb-3">Meus cofrinhos</h3>
${D.inv.length?`<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">${D.inv.map(i=>`<div class="card"><div class="flex justify-between gap-2"><div><div class="font-bold">${esc(i.name)}</div><div class="text-xs text-slate-400">${R(i.pm)} por mês, ${i.pct}% do CDI</div></div><button onclick="delInv('${i.id}')" title="Excluir" class="text-slate-500 hover:text-ros"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div><div class="mt-3 text-xs text-slate-400">Guardado hoje</div><div class="text-xl font-extrabold">${R(i.ini)}</div><div class="text-xs text-em mt-1">Em 1 ano: ${R(proj(i.ini,i.pm,i.pct,12,D.cdi)[12])}</div><button onclick="loadInv('${i.id}')" class="text-xs text-ind font-semibold mt-2">Simular este cofrinho</button></div>`).join('')}</div>`:'<p class="text-sm text-slate-400">Nenhum cofrinho salvo. Ajuste o simulador e salve o primeiro.</p>'}`}
function simUp(){const g=n=>+$('#'+n).value||0,ini=g('s_i'),pm=g('s_p'),pct=g('s_c'),cdi=g('s_b'),o=proj(ini,pm,pct,60,cdi);
 Object.assign(S.sim,{ini,pm,pct});D.cdi=cdi;save();
 $('#res').innerHTML=[[6,'6 meses'],[12,'1 ano'],[24,'2 anos'],[60,'5 anos']].map(([n,l])=>{const a=ini+pm*n;return `<div class="card !p-3"><div class="text-xs text-slate-400">${l}</div><div class="text-lg font-extrabold text-em">${R(o[n])}</div><div class="text-xs text-slate-400">Aportado ${R(a)}</div><div class="text-xs text-ind">Juros +${R(o[n]-a)}</div></div>`}).join('');
 mk('c3',{type:'line',data:{labels:o.map((_,i)=>i),datasets:[{label:'Patrimônio',data:o,borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.12)',fill:true,pointRadius:0,tension:.3},{label:'Total aportado',data:o.map((_,i)=>ini+pm*i),borderColor:'#6366f1',borderDash:[6,4],pointRadius:0}]},
 options:{maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},scales:{x:{grid:{display:false},ticks:{maxRotation:0,autoSkip:false,callback:(v,i)=>i%12?'':i?i/12+(i==12?' ano':' anos'):'Hoje'}},y:{grid:{color:'#334155'}}},plugins:{legend:{position:'bottom',labels:{boxWidth:10}},tooltip:{callbacks:{title:t=>'Mês '+t[0].label}}}}})}
function saveInv(){const g=n=>$('#'+n).value,n=g('s_n').trim();if(!n){$('#s_n').classList.add('!border-ros');return $('#s_n').focus()}
 D.inv.push({id:'i'+Date.now(),name:n,ini:+g('s_i')||0,pm:+g('s_p')||0,pct:+g('s_c')||100});S.sim.name='';save();render()}
const delInv=id=>{D.inv=D.inv.filter(i=>i.id!=id);save();render()};
const loadInv=id=>{const i=D.inv.find(x=>x.id==id);S.sim={name:'',ini:i.ini,pm:i.pm,pct:i.pct};render();scrollTo(0,0)};

/* ---------- assistente (Gemini) ---------- */
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b class="text-em">$1</b>').split('\n').filter(l=>l.trim()).map(l=>/^\s*[-*•]\s/.test(l)?`<div class="flex gap-2"><span class="text-ind">•</span><span>${l.replace(/^\s*[-*•]\s/,'')}</span></div>`:`<div>${l}</div>`).join('');
const bub=m=>`<div class="flex ${m.r=='u'?'justify-end':''}"><div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-sm ${m.r=='u'?'bg-ind text-white':'bg-bg border border-line'}">${m.r=='u'?esc(m.t):fmt(m.t)}</div></div>`;
const add=h=>{const m=$('#msgs');m.insertAdjacentHTML('beforeend',h);m.scrollTop=m.scrollHeight};
function ia(){return `<div class="grid lg:grid-cols-3 gap-4"><div class="card space-y-3 h-fit"><h3 class="font-bold flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4 text-ind"></i>Chave da Gemini API</h3>
<div><label class="lbl">API Key</label><input id="gk" type="password" autocomplete="off" placeholder="Cole sua chave aqui" value="${esc(D.key)}" class="inp"></div>
<div><label class="lbl">Modelo</label><input id="gm" autocomplete="off" value="${esc(D.model)}" class="inp"></div>
<button class="btn w-full" onclick="saveKey(this)">Salvar chave</button><p class="text-xs text-slate-500">A chave fica só neste navegador, dentro do seu perfil. Você gera uma no Google AI Studio.</p></div>
<div class="card lg:col-span-2 flex flex-col h-[70vh] md:h-[34rem]"><div id="msgs" class="flex-1 overflow-y-auto space-y-3 pr-1">${S.chat.map(bub).join('')||bub({r:'ai',t:'- Pergunte sobre gastos, metas ou quanto dá para guardar.'})}</div>
<div class="flex gap-2 flex-wrap my-3">${['Consigo guardar R$ 300 este mês?','Onde posso cortar gastos?','Resuma meu mês'].map(q=>`<button onclick="ask(this.textContent)" class="text-xs bg-bg border border-line rounded-full px-3 py-1.5 hover:border-ind">${q}</button>`).join('')}</div>
<form onsubmit="ask($('#q').value);return false" class="flex gap-2"><input id="q" class="inp" placeholder="Pergunte algo sobre suas finanças" autocomplete="off"><button class="btn" title="Enviar"><i data-lucide="send" class="w-4 h-4"></i></button></form></div></div>`}
function saveKey(b){D.key=$('#gk').value.trim();D.model=$('#gm').value.trim()||'gemini-1.5-flash';save();b.textContent='Chave salva';setTimeout(()=>b.textContent='Salvar chave',1500)}
async function ask(q){q=(q||'').trim();if(!q)return;
 if(!D.key){S.chat.push({r:'ai',t:'- Cole sua **Gemini API Key** ao lado para ativar o assistente.'});return render()}
 $('#q').value='';S.chat.push({r:'u',t:q});add(bub({r:'u',t:q}));add('<div id="ty" class="text-xs text-slate-400">Analisando seus números...</div>');
 const s=stats(),top=Object.entries(s.cats).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c,v])=>`${c}: ${R(v)}`).join('; ')||'sem despesas',
 sys=`Você é um consultor financeiro pessoal. Responda em português do Brasil, de forma EXTREMAMENTE curta e objetiva: apenas tópicos iniciados por "-", no máximo 4, sem saudação nem introdução, com valores em **negrito** e conselhos práticos baseados nos dados. DADOS DO USUÁRIO (${U.name}, mês ${S.month}): saldo total ${R(s.bal)}; receitas do mês ${R(s.r)}; despesas do mês ${R(s.d)}, sendo ${R(s.fix)} em contas fixas; saldo livre do mês ${R(s.r-s.d)}; taxa de poupança ${s.sav}%; maiores categorias de gasto: ${top}; total investido ${R(s.inv)}.`;
 let out='- Não consegui responder. Verifique a chave e a conexão.';
 for(const m of new Set([D.model,'gemini-2.5-flash','gemini-2.0-flash'])){
  try{const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${encodeURIComponent(D.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:J.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:q}]}],generationConfig:{temperature:.4}})}),j=await r.json();
   if(r.status==404){out='- Modelo indisponível. Troque o nome do modelo no painel ao lado.';continue}
   if(!r.ok){out='- Erro da API: '+(j.error?.message||r.status);break}
   out=j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||out;if(m!=D.model){D.model=m;save()}break
  }catch(e){out='- Falha de rede. Tente de novo.';break}}
 $('#ty')?.remove();S.chat.push({r:'ai',t:out});add(bub({r:'ai',t:out}))}

/* ---------- renderização ---------- */
const mk=(id,cfg)=>{charts[id]?.destroy();const c=document.getElementById(id);if(c)charts[id]=new Chart(c,cfg)};
function drawDash(){const s=stats(),k=Object.keys(s.cats),lg={position:'bottom',labels:{boxWidth:10}},
 ms=[...Array(6)].map((_,i)=>{const d=new Date(S.month+'-15');d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});
 mk('c1',{type:'doughnut',data:{labels:k.length?k:['Sem despesas'],datasets:[{data:k.length?k.map(c=>s.cats[c]):[1],backgroundColor:k.length?PAL:['#334155'],borderColor:'#1e293b',borderWidth:3}]},options:{maintainAspectRatio:false,cutout:'68%',plugins:{legend:lg,tooltip:{enabled:k.length>0}}}});
 mk('c2',{type:'bar',data:{labels:ms.map(m=>new Date(m+'-15').toLocaleDateString('pt-BR',{month:'short'}).replace('.','')),datasets:[['Receitas','r','#10b981'],['Despesas','d','#f43f5e']].map(([label,t,c])=>({label,data:ms.map(m=>sum(inM(m),t)),backgroundColor:c,borderRadius:6}))},options:{maintainAspectRatio:false,scales:{x:{grid:{display:false}},y:{grid:{color:'#334155'}}},plugins:{legend:lg}}})}
function render(){Object.values(charts).forEach(c=>c.destroy());charts={};
 $('#app').innerHTML=U?shell({dash,tx,inv,ia}[S.tab]()):authView();
 lucide.createIcons();
 if(U){if(S.tab=='dash')drawDash();if(S.tab=='inv')simUp();const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}}
const u0=users.find(u=>u.id==get('fin_session',null));u0?start(u0):render();
</script>
</body>
</html>
